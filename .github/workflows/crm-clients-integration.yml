name: CRM Clients Integration

on:
  workflow_dispatch:

jobs:
  crm-clients-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.HOSTINGER_DATABASE_URL }}
      JWT_SECRET: stage3_ci_only_secret_2026_bitalis_do_not_use_in_production
      ADMIN_EMAIL: ${{ secrets.BITALIS_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.BITALIS_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || (echo 'HOSTINGER_DATABASE_URL is missing' && exit 1)
          test -n "$ADMIN_EMAIL" || (echo 'BITALIS_ADMIN_EMAIL is missing' && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo 'BITALIS_ADMIN_PASSWORD is missing' && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Generate MySQL schema and Prisma Client
        run: |
          node scripts/prepare-mysql-schema.js
          npx prisma generate --schema=prisma/schema.mysql.prisma

      - name: Start Next.js server
        run: |
          npm run dev > /tmp/bitalis-next.log 2>&1 &
          echo $! > /tmp/bitalis-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bitalis-next.log
          exit 1

      - name: Test CRM clients with real login
        run: |
          node <<'NODE'
          const http = require('http');

          function request(method, path, body, token) {
            return new Promise((resolve, reject) => {
              const payload = body ? JSON.stringify(body) : null;
              const req = http.request({
                hostname: '127.0.0.1', port: 3000, path, method,
                headers: {
                  ...(payload ? {'content-type':'application/json','content-length':Buffer.byteLength(payload)} : {}),
                  ...(token ? {'authorization':`Bearer ${token}`} : {})
                }
              }, res => {
                let data=''; res.on('data', c => data += c); res.on('end', () => resolve({status:res.statusCode, body:data}));
              });
              req.on('error', reject); if (payload) req.write(payload); req.end();
            });
          }

          (async () => {
            const email = process.env.ADMIN_EMAIL;
            const password = process.env.ADMIN_PASSWORD;
            if (!email || !password) throw new Error('BITALIS admin secrets are required');

            const unauth = await request('GET','/api/clients?page=1&limit=5');
            if (unauth.status !== 401) throw new Error(`Expected unauthenticated clients request to return 401, got ${unauth.status}: ${unauth.body}`);

            const login = await request('POST','/api/auth/login',{email,password});
            if (login.status !== 200) throw new Error(`Login HTTP ${login.status}: ${login.body}`);
            const loginJson = JSON.parse(login.body);
            const token = loginJson.accessToken || loginJson.token || loginJson.data?.accessToken || loginJson.data?.token;
            if (!token) throw new Error(`Login response did not contain access token: ${login.body}`);

            const clients = await request('GET','/api/clients?page=1&limit=5',null,token);
            if (clients.status !== 200) throw new Error(`Clients HTTP ${clients.status}: ${clients.body}`);
            const clientsJson = JSON.parse(clients.body);
            if (clientsJson.success !== true) throw new Error(`Clients API did not return success=true: ${clients.body}`);
            console.log('Authenticated CRM clients endpoint OK');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/bitalis-next.log || true
