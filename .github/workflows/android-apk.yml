name: BITALIS Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'app/settings/page.tsx'
  workflow_run:
    workflows: ['MySQL Prisma Schema Check']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitalis-android-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'manual' }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BITALIS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      BITALIS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout BITALIS source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Android signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BITALIS_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BITALIS_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BITALIS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BITALIS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          REQUIRE_RELEASE='false'
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            REQUIRE_RELEASE='true'
          fi

          if [[ -n "${KEYSTORE_B64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            mkdir -p "$RUNNER_TEMP/bitalis-signing"
            KEYSTORE_PATH="$RUNNER_TEMP/bitalis-signing/bitalis-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "BITALIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "BITALIS_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BITALIS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BITALIS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'BITALIS_SIGNING_MODE=release' >> "$GITHUB_ENV"
          elif [[ "$REQUIRE_RELEASE" == 'true' ]]; then
            echo '::error::Faltan los cuatro GitHub Actions Secrets de firma Android. main no publicará un APK con firma temporal.'
            exit 1
          else
            echo 'BITALIS_SIGNING_MODE=debug' >> "$GITHUB_ENV"
            echo 'PR/test build: usando firma debug temporal; este APK no se publica como Latest.'
          fi

      - name: Build installable APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BITALIS_SIGNING_MODE" == 'release' ]]; then
            gradle -p android :app:assembleRelease --no-daemon
            APK_PATH='android/app/build/outputs/apk/release/app-release.apk'
          else
            gradle -p android :app:assembleDebug --no-daemon
            APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk'
          fi
          test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH='${{ steps.apk.outputs.path }}'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt

      - name: Package BITALIS APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSIONED_APK="BITALIS-${BITALIS_ANDROID_VERSION_NAME}.apk"
          cp '${{ steps.apk.outputs.path }}' "dist/${VERSIONED_APK}"
          cp "dist/${VERSIONED_APK}" dist/BITALIS-latest.apk
          cp apk-signature.txt dist/BITALIS-signature.txt
          sha256sum "dist/${VERSIONED_APK}" | tee dist/BITALIS-latest.sha256
          APK_SHA="$(cut -d' ' -f1 dist/BITALIS-latest.sha256)"
          CERT_SHA="$(sed -n 's/.*certificate SHA-256 digest: *//p' apk-signature.txt | head -n 1)"
          cat > dist/BITALIS-android-update.json <<EOF
          {
            "versionCode": ${BITALIS_ANDROID_VERSION_CODE},
            "versionName": "${BITALIS_ANDROID_VERSION_NAME}",
            "sourceSha": "${SOURCE_SHA}",
            "apkUrl": "https://github.com/Arq941/Bitalispro1/releases/download/bitalis-android-latest/${VERSIONED_APK}",
            "sha256": "${APK_SHA}"
          }
          EOF
          cat > dist/release-notes.txt <<EOF
          BITALIS Android

          Version: ${BITALIS_ANDROID_VERSION_NAME}
          Web/Main commit: ${SOURCE_SHA}
          Android build: ${GITHUB_RUN_NUMBER}
          Firma: ${BITALIS_SIGNING_MODE}
          Certificado SHA-256: ${CERT_SHA:-no-disponible}

          El APK abre la producción oficial de BITALIS y conserva sesión/datos WebView entre actualizaciones de la aplicación.
          Las actualizaciones se publican con nombre de versión para evitar instalar por error una descarga antigua.
          EOF

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BITALIS-Android-${{ env.BITALIS_ANDROID_VERSION_NAME }}
          path: |
            dist/BITALIS-${{ env.BITALIS_ANDROID_VERSION_NAME }}.apk
            dist/BITALIS-latest.apk
            dist/BITALIS-latest.sha256
            dist/BITALIS-signature.txt
            dist/BITALIS-android-update.json
            dist/release-notes.txt
          retention-days: 30

      - name: Update BITALIS Android Latest release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$BITALIS_SIGNING_MODE" != 'release' ]]; then
            echo 'No se publica Latest sin firma persistente de producción.'
            exit 0
          fi
          if ! gh release view bitalis-android-latest >/dev/null 2>&1; then
            gh release create bitalis-android-latest \
              --target "$SOURCE_SHA" \
              --title 'BITALIS Android · Latest' \
              --notes-file dist/release-notes.txt
          fi
          gh release upload bitalis-android-latest \
            "dist/BITALIS-${BITALIS_ANDROID_VERSION_NAME}.apk" \
            dist/BITALIS-latest.apk \
            dist/BITALIS-latest.sha256 \
            dist/BITALIS-signature.txt \
            dist/BITALIS-android-update.json \
            --clobber
          gh release edit bitalis-android-latest \
            --title "BITALIS Android · Latest · ${BITALIS_ANDROID_VERSION_NAME}" \
            --notes-file dist/release-notes.txt
