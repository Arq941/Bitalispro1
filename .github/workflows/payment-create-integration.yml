name: Payment Create Integration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE_TEST_PAYMENT to register one test payment in production'
        required: true
        type: string

jobs:
  payment-create-integration:
    if: ${{ inputs.confirmation == 'CREATE_TEST_PAYMENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.HOSTINGER_DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.BITALIS_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.BITALIS_ADMIN_PASSWORD }}
      JWT_SECRET: bitalis_stage3_payment_ci_secret_2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate MySQL schema and Prisma Client
        run: |
          node scripts/prepare-mysql-schema.js
          npx prisma generate --schema=prisma/schema.mysql.prisma

      - name: Wait for Hostinger MySQL connectivity
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const wait = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            for (let i=1;i<=8;i++) {
              const prisma = new PrismaClient();
              try {
                await prisma.$queryRawUnsafe('SELECT 1');
                console.log('MYSQL_CONNECTIVITY_OK');
                await prisma.$disconnect();
                return;
              } catch (e) {
                console.log(`MySQL attempt ${i}/8 failed: ${e.message}`);
                await prisma.$disconnect().catch(()=>{});
                if (i===8) throw e;
                await wait(15000);
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Start Next.js server
        run: |
          npm run dev > /tmp/bitalis-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/bitalis-next.log
          exit 1

      - name: Register payment and verify balance and cash
        run: |
          node <<'NODE'
          const http = require('http');
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          function request(method,path,body,token){
            return new Promise((resolve,reject)=>{
              const payload=body?JSON.stringify(body):null;
              const req=http.request({hostname:'127.0.0.1',port:3000,path,method,headers:{...(payload?{'content-type':'application/json','content-length':Buffer.byteLength(payload)}:{}),...(token?{authorization:`Bearer ${token}`}:{})}},res=>{let data='';res.on('data',c=>data+=c);res.on('end',()=>resolve({status:res.statusCode,body:data}));});
              req.on('error',reject); if(payload) req.write(payload); req.end();
            });
          }
          (async()=>{
            const email=process.env.ADMIN_EMAIL,password=process.env.ADMIN_PASSWORD;
            if(!email||!password) throw new Error('BITALIS admin secrets are required');
            const admin=await prisma.user.findUnique({where:{email}});
            if(!admin) throw new Error('Admin not found');

            const credit=await prisma.credit.findFirst({where:{status:'ACTIVE',saldoActual:{gt:100}},orderBy:{createdAt:'desc'}});
            if(!credit) throw new Error('No ACTIVE credit with balance > 100 found');
            const beforeBalance=Number(credit.saldoActual);

            let session=await prisma.cashSession.findFirst({where:{userId:admin.id,status:{in:['OPEN','OPERATING']}},orderBy:{createdAt:'desc'}});
            if(!session){
              session=await prisma.cashSession.create({data:{userId:admin.id,collectorId:admin.id,openingFund:0,currentCash:0,expectedCash:0,status:'OPEN',openedAt:new Date(),openedClientAt:new Date(),deviceId:'CI-PAYMENT',openingNotes:'Integration payment test',openedBy:admin.id}});
            }
            const beforeCash=Number(session.currentCash);

            const login=await request('POST','/api/auth/login',{email,password});
            if(login.status!==200) throw new Error(`Login HTTP ${login.status}: ${login.body}`);
            const lj=JSON.parse(login.body); const token=lj.accessToken||lj.token||lj.data?.accessToken||lj.data?.token;
            if(!token) throw new Error('No access token');

            const amount=100;
            const key=`payment-ci-${Date.now()}`;
            const created=await request('POST','/api/payments',{creditId:credit.id,amount,paymentMethod:'CASH',cashSessionId:session.id,idempotencyKey:key,notes:'Pago de integración'},token);
            if(created.status!==201) throw new Error(`POST /api/payments HTTP ${created.status}: ${created.body}`);
            const cj=JSON.parse(created.body); const paymentId=cj.payment?.id;
            if(!paymentId) throw new Error(`Payment id missing: ${created.body}`);

            const payment=await prisma.payment.findUnique({where:{id:paymentId}});
            if(!payment) throw new Error('Payment was not persisted');
            const updatedCredit=await prisma.credit.findUnique({where:{id:credit.id}});
            if(!updatedCredit) throw new Error('Credit disappeared');
            const afterBalance=Number(updatedCredit.saldoActual);
            if(Math.abs((beforeBalance-amount)-afterBalance)>0.001) throw new Error(`Balance mismatch before=${beforeBalance} after=${afterBalance}`);

            const movement=await prisma.cashMovement.findFirst({where:{paymentId}});
            if(!movement) throw new Error('PAYMENT cash movement was not persisted');
            const updatedSession=await prisma.cashSession.findUnique({where:{id:session.id}});
            if(!updatedSession) throw new Error('Cash session disappeared');
            const afterCash=Number(updatedSession.currentCash);
            if(Math.abs((beforeCash+amount)-afterCash)>0.001) throw new Error(`Cash mismatch before=${beforeCash} after=${afterCash}`);

            console.log('PAYMENT CREATE INTEGRATION PASSED',{paymentId,creditId:credit.id,beforeBalance,afterBalance,cashSessionId:session.id,beforeCash,afterCash});
          })().finally(()=>prisma.$disconnect()).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/bitalis-next.log || true
