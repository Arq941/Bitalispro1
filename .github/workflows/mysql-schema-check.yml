name: MySQL Prisma Schema Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prisma-mysql-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and create real lockfile
        run: npm install

      - name: Show Prisma versions
        run: npx prisma -v

      - name: Generate complete MySQL Prisma schema
        run: node scripts/prepare-mysql-schema.js

      - name: Verify generated schema is complete
        run: |
          grep -q 'model User {' prisma/schema.mysql.prisma
          grep -q 'model Client {' prisma/schema.mysql.prisma
          grep -q 'model Sale {' prisma/schema.mysql.prisma
          grep -q 'model Credit {' prisma/schema.mysql.prisma
          grep -q 'model Payment {' prisma/schema.mysql.prisma
          grep -q 'model KardexMovement {' prisma/schema.mysql.prisma
          grep -q 'model SyncOperation {' prisma/schema.mysql.prisma
          test "$(grep -c '^model ' prisma/schema.mysql.prisma)" -gt 20

      - name: Format MySQL schema
        run: npx prisma format --schema=prisma/schema.mysql.prisma

      - name: Validate MySQL Prisma schema
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/bitalis_validation
        run: npx prisma validate --schema=prisma/schema.mysql.prisma

      - name: Generate Prisma Client for MySQL
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/bitalis_validation
        run: npx prisma generate --schema=prisma/schema.mysql.prisma
