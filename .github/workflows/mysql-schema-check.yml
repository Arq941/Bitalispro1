name: MySQL Prisma Schema Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prisma-mysql-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate MySQL Prisma schema
        run: node scripts/prepare-mysql-schema.js

      - name: Validate MySQL Prisma schema
        run: npx prisma validate --schema=prisma/schema.mysql.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.mysql.prisma
