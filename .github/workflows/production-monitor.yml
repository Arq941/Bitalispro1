name: BITALIS Production Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: bitalis-production-monitor
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://gold-skunk-480372.hostingersite.com
    steps:
      - name: Verify version, health and operational routes
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30             -D monitor/version.headers "$BASE_URL/build-version.txt" -o monitor/build-version.txt
          grep -q '^BITALIS BUILD$' monitor/build-version.txt
          grep -Eq '^commit=[0-9a-f]{40}$' monitor/build-version.txt
          grep -q '^marker=client-build-coherence$' monitor/build-version.txt

          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30             -D monitor/health.headers "$BASE_URL/api/health" -o monitor/health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('monitor/health.json','utf8'));if(h.status!=='ok'||h.environment!=='production'||h.database!=='connected')process.exit(1)"

          for route in reports portfolio control-center; do
            curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30               -D "monitor/$route.headers" "$BASE_URL/$route" -o "monitor/$route.html"
            grep -q '/_next/static/' "monitor/$route.html"
          done

          for alias in reportes cartera; do
            code="$(curl --silent --show-error --output /dev/null --max-time 30 --write-out '%{http_code}' "$BASE_URL/$alias")"
            test "$code" = "308"
          done

          {
            echo "checked_at=$(date -u +%FT%TZ)"
            sed -n 's/^commit=/commit=/p' monitor/build-version.txt
            echo "health=ok"
            echo "database=connected"
            echo "routes=reports,portfolio,control-center"
            echo "aliases=reportes,cartera"
          } | tee monitor/summary.txt

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitalis-production-monitor-${{ github.run_id }}
          path: monitor/
          retention-days: 14

      - name: Open or update incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Producción] BITALIS requiere atención';
            const marker = '<!-- bitalis-production-monitor -->';
            const body = [
              marker,
              'El monitor automático detectó una falla en versión, salud, base de datos o rutas operativas.',
              '',
              `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Detectado: ${new Date().toISOString()}`,
              '',
              'No se modificaron datos ni se reinició producción automáticamente.'
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo,state:'open',labels:'production-monitor',per_page:20});
            const incident = issues.find(issue => issue.title === title);
            if (incident) {
              await github.rest.issues.createComment({...context.repo,issue_number:incident.number,body});
            } else {
              await github.rest.issues.create({...context.repo,title,body,labels:['production-monitor']});
            }
