name: Cash Lifecycle Integration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type TEST_CASH_LIFECYCLE to test cash opening/count/close in production'
        required: true
        type: string

jobs:
  cash-lifecycle-integration:
    if: ${{ inputs.confirmation == 'TEST_CASH_LIFECYCLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.HOSTINGER_DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.BITALIS_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.BITALIS_ADMIN_PASSWORD }}
      JWT_SECRET: bitalis_stage3_cash_ci_secret_2026

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Generate MySQL Prisma Client
        run: |
          node scripts/prepare-mysql-schema.js
          npx prisma generate --schema=prisma/schema.mysql.prisma

      - name: Wait for Hostinger MySQL connectivity
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            for(let i=1;i<=8;i++){
              const p=new PrismaClient();
              try { await p.$queryRaw`SELECT 1`; console.log('MYSQL_CONNECTIVITY_OK'); await p.$disconnect(); return; }
              catch(e){ console.log(`MySQL attempt ${i}/8 failed`); await p.$disconnect().catch(()=>{}); if(i===8) throw e; await sleep(15000); }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Start Next.js server
        run: |
          npm run dev > /tmp/bitalis-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/bitalis-next.log
          exit 1

      - name: Test cash open count close
        run: |
          node <<'NODE'
          const http=require('http');
          const {PrismaClient}=require('@prisma/client');
          const prisma=new PrismaClient();
          function req(method,path,body,token){return new Promise((resolve,reject)=>{const payload=body?JSON.stringify(body):null;const r=http.request({hostname:'127.0.0.1',port:3000,path,method,headers:{...(payload?{'content-type':'application/json','content-length':Buffer.byteLength(payload)}:{}),...(token?{authorization:`Bearer ${token}`}:{})}},res=>{let d='';res.on('data',c=>d+=c);res.on('end',()=>resolve({status:res.statusCode,body:d}))});r.on('error',reject);if(payload)r.write(payload);r.end()})}
          (async()=>{
            const login=await req('POST','/api/auth/login',{email:process.env.ADMIN_EMAIL,password:process.env.ADMIN_PASSWORD});
            if(login.status!==200) throw new Error(`Login ${login.status}: ${login.body}`);
            const lj=JSON.parse(login.body); const token=lj.accessToken||lj.data?.accessToken||lj.token||lj.data?.token; if(!token) throw new Error('No token');
            const admin=await prisma.user.findUnique({where:{email:process.env.ADMIN_EMAIL}}); if(!admin) throw new Error('Admin missing');

            let session=await prisma.cashSession.findFirst({where:{userId:admin.id,status:{in:['OPEN','OPERATING','COUNTING','PENDING_REVIEW']}},orderBy:{openedAt:'desc'}});
            if(!session){
              const opened=await req('POST','/api/cash-sessions/open',{openingFund:0,latitude:19.25,longitude:-98.9,deviceId:'CI-CASH',idempotencyKey:`cash-ci-open-${Date.now()}`},token);
              if(opened.status!==201) throw new Error(`Open ${opened.status}: ${opened.body}`);
              const oj=JSON.parse(opened.body); session=oj.data?.session||oj.data; if(!session?.id) throw new Error(`Open missing session id: ${opened.body}`);
            }

            session=await prisma.cashSession.findUnique({where:{id:session.id}});
            const expected=Number(session.expectedCash);
            if(!Number.isInteger(expected) || expected<0) throw new Error(`CI requires non-negative integer expected cash; got ${expected}`);
            const count=await req('POST','/api/cash-sessions/count',{cashSessionId:session.id,denominations:{bills1:expected}},token);
            if(count.status!==201) throw new Error(`Count ${count.status}: ${count.body}`);

            const close=await req('POST','/api/cash-sessions/close',{cashSessionId:session.id,closingNotes:'CI cash lifecycle exact count',latitude:19.25,longitude:-98.9},token);
            if(close.status!==200) throw new Error(`Close ${close.status}: ${close.body}`);
            const persisted=await prisma.cashSession.findUnique({where:{id:session.id}});
            if(persisted?.status!=='CLOSED') throw new Error(`Expected CLOSED, got ${persisted?.status}`);
            if(Number(persisted.varianceAmount||0)!==0) throw new Error(`Expected zero variance, got ${persisted.varianceAmount}`);
            console.log('CASH LIFECYCLE INTEGRATION PASSED',{sessionId:session.id,expectedCash:expected,status:persisted.status});
          })().finally(()=>prisma.$disconnect()).catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/bitalis-next.log || true
