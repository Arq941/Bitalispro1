name: Production Build Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  production-build-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.HOSTINGER_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-bitalis-jwt-secret-2026-not-for-production-7f4d2a91' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Validate role security invariants
        run: npm run test:security

      - name: Validate MySQL Prisma schema
        run: npm run prisma:mysql:validate

      - name: TypeScript check
        run: npm run lint

      - name: Build Next.js for MySQL production
        run: npm run build:mysql

      - name: Verify production build output
        run: |
          test -d .next || (echo '.next directory missing' && exit 1)
          test -f .next/BUILD_ID || (echo '.next/BUILD_ID missing' && exit 1)
          test -d .next/standalone/.next/static || (echo 'standalone static assets missing' && exit 1)
          test -f .next/standalone/public/sw.js || (echo 'versioned service worker missing' && exit 1)
          echo "PRODUCTION_BUILD_READY $(cat .next/BUILD_ID)"
