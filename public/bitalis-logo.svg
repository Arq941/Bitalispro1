<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bitalisLeafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bitalisLeafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="bitalisTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="bitalisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM GROUP -->
  <g transform="translate(10, 10)" filter="url(#bitalisGlow)">
    <!-- Base Cross Plate -->
    <path d="M 38 12 H 62 V 38 H 88 V 62 H 62 V 88 H 38 V 62 H 12 V 38 H 38 Z" fill="#1E293B" stroke="#0F172A" stroke-width="3" rx="4" />
    <path d="M 42 16 H 58 V 42 H 84 V 58 H 58 V 84 H 42 V 58 H 16 V 42 H 42 Z" fill="#0F172A" />

    <!-- 4 Leaf Rosette -->
    <path d="M 50 50 C 35 30 20 22 18 36 C 16 50 32 50 50 50 Z" fill="url(#bitalisLeafGrad1)" stroke="#064E3B" stroke-width="2" />
    <path d="M 50 50 C 70 35 78 20 64 18 C 50 16 50 32 50 50 Z" fill="url(#bitalisLeafGrad2)" stroke="#064E3B" stroke-width="2" />
    <path d="M 50 50 C 65 70 80 78 82 64 C 84 50 68 50 50 50 Z" fill="url(#bitalisLeafGrad1)" stroke="#064E3B" stroke-width="2" />
    <path d="M 50 50 C 30 65 22 80 36 82 C 50 84 50 68 50 50 Z" fill="url(#bitalisLeafGrad2)" stroke="#064E3B" stroke-width="2" />

    <!-- Leaf Veins -->
    <path d="M 22 34 C 36 38 46 44 50 50" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 66 22 C 62 36 56 46 50 50" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 78 66 C 64 62 54 56 50 50" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 34 78 C 38 64 44 54 50 50" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />

    <!-- Core Jewel Accent -->
    <circle cx="50" cy="50" r="5" fill="#FDE047" stroke="#047857" stroke-width="1.5" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(125, 30)">
    <!-- Main Title "BITALIS" -->
    <text x="0" y="38" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="6" fill="url(#bitalisTextGrad)">
      BITALIS
    </text>

    <!-- Subtitle "PRODUCTOS NATURISTAS" -->
    <text x="2" y="62" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="4" fill="#94A3B8">
      PRODUCTOS NATURISTAS
    </text>
  </g>
</svg>
